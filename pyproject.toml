[project]
name = "sleep-lifestyle-advisor"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["advisor"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "nbconvert>=7.17.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "artifacts", "figures", "eval_results"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "DTZ",
    "NPY",
    "RUF",
]
ignore = [
    "E501",
    "RUF001",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["B018", "E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["advisor"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["advisor"]

[tool.ty.rules]
unresolved-attribute = "warn"
possibly-missing-attribute = "warn"
